<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo paciente | Fila Já</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <div class="page-header">
        <div class="page-header-content">
            <h1>Novo paciente</h1>
            <p>Preencha os dados para cadastrar um paciente.</p>
        </div>

        <a th:href="@{/pacientes}" class="page-btn page-btn-secondary">
            Voltar aos pacientes
        </a>
    </div>

    <form th:action="@{/pacientes/salvar}" method="post" class="patient-form">

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome"
               required maxlength="100">

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf"
               required minlength="11" maxlength="11"
               placeholder="Somente números">

        <label for="dataNascimento">Data de nascimento</label>
        <input type="date" id="dataNascimento"
               name="dataNascimento" required>

        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone"
               maxlength="20">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email"
               maxlength="100">

        <div class="form-actions">
            <a th:href="@{/pacientes}" class="page-btn page-btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="page-btn page-btn-primary">
                Cadastrar paciente
            </button>
        </div>

    </form>

</div>

</body>
</html>
